      <stop offset="0.58" stop-color="#66412F" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#0B0D10" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="190%" height="210%">
