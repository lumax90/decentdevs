<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc">
  <title id="title">KERTE — Koyu ve sinematik marka konsepti</title>
  <desc id="desc">KERTE çalışma adıyla hazırlanan görsel yön. Kömür siyahı, kırık beyaz ve bakır turuncu. Büyük Fikrin, çalışan hâli başlığı yanında deneyim, uygulama ve altyapı katmanlarına ayrılan örnek bir ürün yüzeyi. Bu görsel bir tasarım konseptidir.</desc>
