      <stop offset="0" stop-color="#181B20"/>
      <stop offset="0.48" stop-color="#111318"/>
      <stop offset="1" stop-color="#191B21"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#252C35"/>
      <stop offset="0.7" stop-color="#171C24"/>
      <stop offset="1" stop-color="#20252E"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#788492"/>
      <stop offset="0.5" stop-color="#3B444F"/>
      <stop offset="1" stop-color="#252C35"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFBA93"/>
      <stop offset="0.45" stop-color="#F0784A"/>
      <stop offset="1" stop-color="#A4482A"/>
    </linearGradient>
